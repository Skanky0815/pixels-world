<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#241f29" />
    <title>Pixel's World · Living room prototype</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ONE ROOM. ONE CAT.</p>
          <h1>Pixel’s World<span>01 / THE LIVING ROOM</span></h1>
        </div>
        <span class="badge">PLAYABLE PROTOTYPE</span>
      </header>
      <div
        id="game"
        role="region"
        aria-label="Pixel's living room. Use arrow keys to move and climb, Space to jump, R to reset. Click the room to focus."
        tabindex="0"
      ></div>
      <footer>
        <p>
          <kbd>←</kbd> <kbd>→</kbd> Move <span>·</span> <kbd>Space</kbd> Jump <span>·</span>
          <kbd>↑</kbd> <kbd>↓</kbd> Climb curtain <span>·</span> <kbd>R</kbd> Neustart
        </p>
        <p class="hint">A quiet afternoon. For now.</p>
        <p class="feedback-link">
          <a
            href="https://github.com/Skanky0815/pixels-world/issues/new/choose"
            target="_blank"
            rel="noopener noreferrer"
            aria-describedby="feedback-note"
            >Feedback &amp; Ideen</a
          >
          <small id="feedback-note">Neuer Tab · GitHub-Konto für Beiträge erforderlich</small>
        </p>
        <p id="build-info" class="build-info" aria-label="Build-Version"></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
