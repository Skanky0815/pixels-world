name: QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      # Reference/source artwork and documentation are not runtime or test inputs.
      - '!assets/**/reference-*/**'
      - '!assets/**/*-source*.png'
      - '!assets/**/*-preview*.png'
      - '!assets/**/*.md'
      - '!assets/banner.*'
      - 'tests/**'
      - 'tools/**'
      - '*.html'
      - '*.css'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.prettier*'
      - 'playwright.config.*'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      # Reference/source artwork and documentation are not runtime or test inputs.
      - '!assets/**/reference-*/**'
      - '!assets/**/*-source*.png'
      - '!assets/**/*-preview*.png'
      - '!assets/**/*.md'
      - '!assets/banner.*'
      - 'tests/**'
      - 'tools/**'
      - '*.html'
      - '*.css'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.prettier*'
      - 'playwright.config.*'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Browserdurchläufe pro Szenario (Stabilitätsprüfung)
        type: choice
        options: ['1', '2', '3']
        default: '1'
        required: true
      round_mode:
        description: Rundenprofil für den vollständigen Heimkehr-Test
        type: choice
        options: ['fast', 'full']
        default: fast
        required: true
  workflow_call:
    inputs:
      full_round:
        description: Produktionszeiten im Heimkehr-Test verwenden
        type: boolean
        default: false
      repetitions:
        description: Browserdurchläufe pro Szenario
        type: string
        default: '1'

env:
  E2E_REPEATS: ${{ inputs.repetitions || '1' }}
  E2E_FULL_ROUND: ${{ (inputs.full_round || inputs.round_mode == 'full') && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR/main runs may stop; manual and release gates must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Release-Gates prüfen
        run: bash tests/ci/release-gates.sh
      - name: Formatierung prüfen
        run: npm run format:check
      - name: Unit-Tests mit TAP-Report
        run: |
          mkdir -p test-reports
          npm run test:unit:ci
      - name: Unit-Testzusammenfassung
        id: unit-summary
        if: ${{ always() && hashFiles('test-reports/unit.tap') != '' }}
        continue-on-error: true
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: test-reports/unit.tap
          show: all
      - name: Hinweise zum Unit-Report
        if: ${{ always() }}
        env:
          SUMMARY_OUTCOME: ${{ steps.unit-summary.outcome }}
        run: |
          echo '### Unit-Tests' >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s test-reports/unit.tap ] || [ "$SUMMARY_OUTCOME" != success ]; then
            echo '::warning::Unit-Testreport fehlt oder konnte nicht dargestellt werden.'
            echo 'Report fehlt oder konnte nicht dargestellt werden; keine vollständige Ergebnisübersicht.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Unit-Report für Gesamtübersicht
        continue-on-error: true
        if: ${{ always() && hashFiles('test-reports/unit.tap') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-test-reports-unit
          path: test-reports/unit.tap
          retention-days: 14
      - run: npm run build
      - name: Abhängigkeiten prüfen
        uses: ./.github/actions/npm-audit

  e2e-shard:
    name: Playwright (Chromium, Teil ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
        # Keep this version and the image digest aligned with package-lock.json.
        playwright: ['1.64.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright-Version mit Browser-Image abgleichen
        env:
          PLAYWRIGHT_IMAGE_VERSION: ${{ matrix.playwright }}
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const installed = require('@playwright/test/package.json').version;
          if (installed !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
            throw new Error(`Playwright ${installed} passt nicht zum Browser-Image ${process.env.PLAYWRIGHT_IMAGE_VERSION}. Image-Version und Digest gemeinsam aktualisieren.`);
          }
          NODE
      - name: Browser-Szenarien
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          case "$E2E_REPEATS" in 1|2|3) ;; *) echo 'Ungültige Durchlaufzahl'; exit 1 ;; esac
          npm run test:e2e -- --repeat-each="$E2E_REPEATS" --shard="$SHARD/$SHARD_TOTAL"
      - name: Geprüften Pages-Build bereitstellen
        if: matrix.shard == 1 && env.E2E_FULL_ROUND == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-pages-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Browser-Testzusammenfassung
        id: browser-summary
        if: ${{ always() && hashFiles('test-reports/playwright.xml') != '' }}
        continue-on-error: true
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: test-reports/playwright.xml
          show: all
      - name: Hinweise zum Browser-Report
        if: ${{ always() }}
        env:
          SUMMARY_OUTCOME: ${{ steps.browser-summary.outcome }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          echo "### Browser-Teil $SHARD/$SHARD_TOTAL · $E2E_REPEATS Durchlauf/Durchläufe, null Retries" >> "$GITHUB_STEP_SUMMARY"
          echo "Vollständige Produktionszeiten: $E2E_FULL_ROUND (1 = ja, 0 = kurze Testkonfiguration)." >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s test-reports/playwright.xml ] || [ "$SUMMARY_OUTCOME" != success ]; then
            echo '::warning::Browser-Testreport fehlt oder konnte nicht dargestellt werden.'
            echo 'Report fehlt oder konnte nicht dargestellt werden; keine vollständige Ergebnisübersicht.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Browser-Report für Gesamtübersicht
        continue-on-error: true
        if: ${{ always() && hashFiles('test-reports/playwright.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-test-reports-browser-${{ matrix.shard }}
          path: test-reports/playwright.xml
          retention-days: 14
      - name: Playwright-Bericht und Fehlerartefakte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e:
    name: Playwright (Chromium)
    if: ${{ always() }}
    needs: [quality, e2e-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Testreports einsammeln
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qa-test-reports-*
          path: qa-reports
      - name: Alle Testszenarien
        id: summary
        if: ${{ always() && hashFiles('qa-reports/**/*.xml', 'qa-reports/**/*.tap') != '' }}
        continue-on-error: true
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: |
            qa-reports/**/*.xml
            qa-reports/**/*.tap
          show: all
      - name: Gesamtzahlen und Vollständigkeit
        if: ${{ always() }}
        env:
          PASSED: ${{ steps.summary.outputs.passed }}
          FAILED: ${{ steps.summary.outputs.failed }}
          SKIPPED: ${{ steps.summary.outputs.skipped }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.reports.outcome }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo '### Gesamtübersicht · tatsächliche Testausführungen' >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUMMARY_OUTCOME" = success ]; then
            echo "Passed: $PASSED · Failed: $FAILED · Skipped: $SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Gesamtübersicht konnte nicht erzeugt werden.'
            echo 'Keine auswertbare Gesamtübersicht vorhanden.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in qa-test-reports-unit/unit.tap qa-test-reports-browser-{1..4}/playwright.xml; do
            if [ ! -s "qa-reports/$report" ]; then
              echo "::warning::Erwarteter Report fehlt: $report"
              echo "**Unvollständig:** Report fehlt: $report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$DOWNLOAD_OUTCOME" != success ]; then
            echo '**Unvollständig:** Artefaktdownload nicht erfolgreich.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Qualität: $QUALITY_RESULT · Browser-Shards: $SHARD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Browserdurchläufe pro Szenario: $E2E_REPEATS. Wiederholungen werden einzeln gezählt. Fehlende/abgebrochene Ausführungen können in den Reports fehlen." >> "$GITHUB_STEP_SUMMARY"
      - name: Qualität und alle vier Teil-Suites müssen erfolgreich sein
        if: ${{ always() }}
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$QUALITY_RESULT" = success && test "$SHARD_RESULT" = success
