name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build

  e2e-shard:
    name: Playwright (Chromium, Teil ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --repeat-each=2 --shard=${{ matrix.shard }}/2
      - name: Playwright-Bericht und Fehlerartefakte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e:
    name: Playwright (Chromium)
    if: ${{ always() }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Beide Teil-Suites müssen erfolgreich sein
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARD_RESULT" = success
