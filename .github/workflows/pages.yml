name: Spiel auf GitHub Pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_FULL_ROUND: '1'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Release-Identität bestätigen
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash .github/scripts/verify-release.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
      - name: Abhängigkeiten prüfen
        uses: ./.github/actions/npm-audit
      - run: npx playwright install --with-deps chromium
      - name: Alle Browser-Szenarien und Pages-Produktionsbuild prüfen
        run: npm run test:e2e
      - name: Fehlerartefakte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-test-results
          path: |
            playwright-report/
            test-results/
            test-reports/
          retention-days: 14
      # Playwright builds and tests dist with /pixels-world/. Publish those exact files.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Geprüften Commit vor Veröffentlichung mit main abgleichen
        if: inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main" = "$GITHUB_SHA"
      - name: Release-Tag vor Deployment erneut bestätigen
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash .github/scripts/verify-release.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Veröffentlichter Spielstand
        env:
          TAG: ${{ inputs.release_tag }}
          SHA: ${{ inputs.release_sha || github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Version/Tag: ${TAG:-manueller main-Stand} · Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Spieladresse: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
