name: Spielrelease

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Versions-PR vorbereiten oder gemergten Versions-PR veröffentlichen
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true

permissions: {}

concurrency:
  group: game-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Erfolgreiche Main-QA und Release-Ausgangspunkt bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: bash .github/scripts/verify-release-source.sh
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.mode == 'prepare' }}
          skip-github-pull-request: ${{ inputs.mode == 'publish' }}
      - name: Erstelltes Release und Tag gegen geprüften Commit verifizieren
        if: inputs.mode == 'publish' && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: bash .github/scripts/verify-release.sh
      - name: Release-Ergebnis
        env:
          MODE: ${{ inputs.mode }}
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "Release-Modus: $MODE · Release erstellt: ${CREATED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $TAG · Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CREATED" != true ]; then
            echo 'Kein neues Release: kein automatischer Pages-Rollout.' >> "$GITHUB_STEP_SUMMARY"
          fi

  pages:
    needs: release
    if: inputs.mode == 'publish' && needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
      release_sha: ${{ needs.release.outputs.sha }}
