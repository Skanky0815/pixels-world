name: '💡 Feature-Wunsch'
description: Eine Idee für Pixel’s World vorschlagen.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Danke für deine Idee! Beschreibe kurz, was du dir wünschst. Eine technische Lösung brauchst du nicht. Bitte bleib freundlich und konkret.
  - type: textarea
    id: idea
    attributes:
      label: Was wünschst du dir?
      description: Beschreibe deine Idee und das gewünschte Verhalten.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Warum wäre das hilfreich oder unterhaltsam?
      description: Welches Problem löst die Idee oder was macht sie am Spiel besser?
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: Auswirkungen auf Spiel oder Bedienung (optional)
      description: Wie könnte man die Idee im Spiel bemerken oder verwenden?
  - type: textarea
    id: object_interactions
    attributes:
      label: Wechselwirkungen mit anderen Gegenständen (bei neuen Objekten)
      description: >-
        Wie kann der Gegenstand andere beeinflussen und selbst beeinflusst werden?
        Auch gleiche Gegenstände und leichte/starke Kontakte bedenken;
        nicht jede Berührung muss Schaden verursachen. Siehe #135.
      placeholder: Zum Beispiel eine fallende Tasse, die einen anderen Gegenstand anstößt. Was passiert beim sanften Schieben, Rollen oder einem starken Aufprall? Welche Dinge bleiben standfest?
  - type: textarea
    id: examples
    attributes:
      label: Bilder, Skizzen oder Beispiele (optional)
      description: Hier kannst du ergänzende Bilder einfügen.
  - type: textarea
    id: acceptance
    attributes:
      label: Woran wäre die Idee gelungen? (optional)
      description: Falls du möchtest, nenne konkrete Beispiele oder Akzeptanzkriterien.
